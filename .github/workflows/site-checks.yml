# CJP site checks v1.0.0 (skills repo new-client-build/assets/wave5, 2026-11-16).
# Build + JSON-LD check (postbuild) + axe serious/critical + page-weight budget on key pages.
# PRs only (plus manual runs) to keep Actions minutes low. A red run blocks the merge.
name: site-checks
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build (prebuild + next build + postbuild seo-guard + JSON-LD check)
        run: npm run build
      - name: Start
        run: |
          (npx next start -p 3000 > "$RUNNER_TEMP/next.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3000/ || (cat "$RUNNER_TEMP/next.log"; exit 1)
      - name: Install check tools
        run: |
          echo "CHECK_DEPS=$RUNNER_TEMP/ck" >> "$GITHUB_ENV"
          CHECK_DEPS="$RUNNER_TEMP/ck"
          npm i --no-save --no-audit --no-fund --prefix "$CHECK_DEPS" playwright@1.49.1 axe-core@4.10.2
          "$CHECK_DEPS/node_modules/.bin/playwright" install --with-deps chromium
      - name: Accessibility (axe) + page weight
        run: BASE_URL=http://localhost:3000 node scripts/site-checks.mjs
